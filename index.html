<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdul Majid Cloths | Premium Fashion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a1a2e;
      --secondary: #c9a227; /* Gold accent */
      --accent: #e94560;
      --light: #f8f5f0;
      --dark: #0f0f1a;
      --text: #333;
      --gray: #666;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    h1, h2, h3, .logo {
      font-family: 'Playfair Display', serif;
    }

    /* Header */
    header {
      background: var(--primary);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      color: var(--secondary);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      position: relative;
    }

    nav a:hover {
      color: var(--secondary);
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--secondary);
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .cart-btn {
      background: var(--secondary);
      color: var(--dark);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, background 0.3s;
    }

    .cart-btn:hover {
      transform: scale(1.05);
      background: #dbb42c;
    }

    .cart-count {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      height: 85vh;
      background: linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.8)), 
                  url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      position: relative;
    }

    .hero-content {
      max-width: 800px;
      padding: 2rem;
      animation: fadeUp 1s ease;
    }

    .hero h1 {
      font-size: 3.8rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .hero h1 span {
      color: var(--secondary);
    }

    .hero p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: var(--secondary);
      color: var(--dark);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover {
      background: #dbb42c;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(201, 162, 39, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid white;
      color: white;
      margin-left: 1rem;
    }

    .btn-outline:hover {
      background: white;
      color: var(--primary);
    }

    /* Sections */
    section {
      padding: 5rem 2rem;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .section-title p {
      color: var(--gray);
      max-width: 600px;
      margin: 0 auto;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: var(--secondary);
      margin: 1rem auto;
    }

    /* Products */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    .product-img {
      height: 320px;
      overflow: hidden;
      position: relative;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }

    .product-card:hover .product-img img {
      transform: scale(1.08);
    }

    .badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--accent);
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .product-info {
      padding: 1.5rem;
    }

    .product-category {
      color: var(--secondary);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-title {
      font-size: 1.25rem;
      margin: 0.4rem 0;
      color: var(--primary);
    }

    .product-price {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.8rem 0 1.2rem;
    }

    .current-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .old-price {
      text-decoration: line-through;
      color: #999;
      font-size: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 0.8rem;
    }

    .add-to-cart {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .add-to-cart:hover {
      background: #2a2a4a;
    }

    .view-btn {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      width: 45px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .view-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Categories */
    .categories {
      background: var(--primary);
      color: white;
    }

    .categories .section-title h2 {
      color: white;
    }

    .categories .section-title p {
      color: rgba(255,255,255,0.8);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .category-card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .category-card:hover {
      background: rgba(201, 162, 39, 0.15);
      transform: translateY(-5px);
      border-color: var(--secondary);
    }

    .category-card i {
      font-size: 2.5rem;
      color: var(--secondary);
      margin-bottom: 1rem;
    }

    .category-card h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }

    /* About */
    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-img {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .about-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .about-text h2 {
      font-size: 2.3rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .about-text p {
      margin-bottom: 1.2rem;
      color: var(--gray);
    }

    .stats {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
    }

    .stat h3 {
      font-size: 2rem;
      color: var(--secondary);
    }

    .stat p {
      font-size: 0.9rem;
      color: var(--gray);
    }

    /* Contact */
    .contact {
      background: #f0ebe3;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    .contact-info h3 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }

    .contact-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .contact-item i {
      font-size: 1.3rem;
      color: var(--secondary);
      margin-top: 5px;
    }

    .contact-form {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--secondary);
    }

    /* Footer */
    footer {
      background: var(--dark);
      color: white;
      padding: 4rem 2rem 2rem;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 3rem;
      max-width: 1280px;
      margin: 0 auto 3rem;
    }

    .footer-brand .logo {
      margin-bottom: 1rem;
      display: inline-block;
    }

    .footer-brand p {
      opacity: 0.8;
      margin-bottom: 1.5rem;
      max-width: 300px;
    }

    .social-links {
      display: flex;
      gap: 1rem;
    }

    .social-links a {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: all 0.3s;
    }

    .social-links a:hover {
      background: var(--secondary);
      color: var(--dark);
    }

    .footer-links h4 {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      color: var(--secondary);
    }

    .footer-links ul {
      list-style: none;
    }

    .footer-links li {
      margin-bottom: 0.7rem;
    }

    .footer-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: var(--secondary);
    }

    .copyright {
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* Cart Sidebar */
    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100%;
      background: white;
      box-shadow: -10px 0 30px rgba(0,0,0,0.15);
      z-index: 2000;
      transition: right 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h3 {
      font-size: 1.4rem;
    }

    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .cart-item-price {
      color: var(--secondary);
      font-weight: 600;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .remove-item {
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: var(--secondary);
      color: var(--dark);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .checkout-btn:hover {
      background: #dbb42c;
    }

    .empty-cart {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--gray);
    }

    .empty-cart i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1500;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Product Modal */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: white;
      width: 90%;
      max-width: 900px;
      border-radius: 20px;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      overflow: hidden;
      max-height: 90vh;
      display: flex;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-img {
      flex: 1;
      min-height: 400px;
    }

    .modal-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-content {
      flex: 1;
      padding: 2.5rem;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .size-options, .color-options {
      display: flex;
      gap: 0.8rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }

    .size-btn, .color-btn {
      padding: 0.5rem 1rem;
      border: 2px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .size-btn.active, .color-btn.active {
      border-color: var(--secondary);
      background: rgba(201, 162, 39, 0.1);
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      padding: 0;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 992px) {
      .about-content,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .hero h1 {
        font-size: 2.8rem;
      }

      .modal {
        flex-direction: column;
        max-height: 85vh;
      }

      .modal-img {
        height: 250px;
        min-height: auto;
      }
    }

    @media (max-width: 768px) {
      nav {
        display: none;
      }

      .mobile-toggle {
        display: block;
      }

      .hero {
        height: 70vh;
      }

      .hero h1 {
        font-size: 2.2rem;
      }

      .btn-outline {
        margin-left: 0;
        margin-top: 1rem;
        display: inline-block;
      }

      .cart-sidebar {
        width: 100%;
        right: -100%;
      }

      .footer-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .stats {
        flex-wrap: wrap;
      }
    }

    /* Mobile Menu */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      height: 100%;
      background: var(--primary);
      z-index: 2000;
      transition: left 0.3s;
      padding: 2rem;
    }

    .mobile-menu.open {
      left: 0;
    }

    .mobile-menu ul {
      list-style: none;
      margin-top: 3rem;
    }

    .mobile-menu li {
      margin-bottom: 1.5rem;
    }

    .mobile-menu a {
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 500;
    }
  </style>
</head>

  </div>

  <section class="hero" id="home">
